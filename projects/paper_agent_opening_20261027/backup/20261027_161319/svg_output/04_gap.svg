  </g>
  <g id="footer" data-pptx-bounds="64 676 1152 24">
    <text x="64" y="696" font-size="14" fill="#5B6770">现状与缺口 · 三条研究线指向同一工程空白</text>
    <text x="1130" y="696" text-anchor="end" font-size="14" fill="#5B6770">P04 / 14</text>
  </g>
