      <text x="934" y="368" font-size="18" fill="#5B6770">Draft / Verification</text>
    </g>
    <g id="rule-evidence">
      <use data-icon="tabler-outline/link" x="880" y="386" width="36" height="36" fill="#0E3B43" stroke-width="2"/>
      <text x="934" y="411" font-size="24" font-weight="bold" fill="#1F2933">证据优先</text>
      <text x="934" y="438" font-size="18" fill="#5B6770">claim 绑定 evidenceId</text>
      <text x="934" y="464" font-size="18" fill="#5B6770">与原文定位</text>
    </g>
    <g id="rule-recovery">
      <use data-icon="tabler-outline/shield-check" x="880" y="482" width="36" height="36" fill="#D97706" stroke-width="2"/>
      <text x="934" y="507" font-size="24" font-weight="bold" fill="#1F2933">失败可恢复</text>
      <text x="934" y="534" font-size="18" fill="#5B6770">检查点、重试与人工复核入口</text>
    </g>
    <text x="880" y="576" font-size="18" font-weight="bold" fill="#8B4A16">目标：可交互 · 可追溯 · 可复现</text>
  </g>
  <g id="takeaway" data-pptx-bounds="64 610 1152 42">
    <text x="64" y="640" font-size="24" font-weight="bold" fill="#D97706">从主题输入到报告导出，每一个阶段都有状态、产物和证据可查。</text>
  </g>
  <g id="footer" data-pptx-bounds="64 676 1152 24">
