      <rect x="330" y="382" width="92" height="30" rx="6" fill="#E8EFEA"/>
      <text x="376" y="403" text-anchor="middle" font-size="14" fill="#0E3B43">分析</text>
      <rect x="434" y="382" width="92" height="30" rx="6" fill="#E8EFEA"/>
      <text x="480" y="403" text-anchor="middle" font-size="14" fill="#0E3B43">对比</text>
      <rect x="538" y="382" width="92" height="30" rx="6" fill="#E8EFEA"/>
      <text x="584" y="403" text-anchor="middle" font-size="14" fill="#0E3B43">撰写</text>
