    <text x="96" y="282" font-size="64" font-weight="bold" fill="#D97706">“</text>
    <text x="152" y="300" font-size="30" font-weight="bold" fill="#0E3B43">可信科研辅助，不是替代研究者，</text>
    <text x="152" y="342" font-size="30" font-weight="bold" fill="#0E3B43">而是把证据链变成可检查的工作流。</text>
    <path d="M152 380H704" stroke="#BED0C5" stroke-width="1"/>
    <text x="152" y="420" font-size="18" fill="#5B6770">从任务分解、混合检索、结构化融合，</text>
    <text x="152" y="446" font-size="18" fill="#5B6770">到 claim–evidence–locator 的引用校验。</text>
