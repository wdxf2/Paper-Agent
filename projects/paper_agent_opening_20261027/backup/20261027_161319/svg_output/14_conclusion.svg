    <text x="832" y="256" font-size="18" font-weight="bold" fill="#2F6F7E" letter-spacing="2">THREE TAKEAWAYS</text>
    <g id="pillar-1">
      <text x="832" y="302" font-size="24" font-weight="bold" fill="#D97706">01</text>
      <text x="882" y="302" font-size="24" font-weight="bold" fill="#0E3B43">任务图管理复杂度</text>
      <text x="882" y="328" font-size="18" fill="#5B6770">用契约与检查点控制多智能体</text>
    </g>
    <g id="pillar-2">
      <text x="832" y="380" font-size="24" font-weight="bold" fill="#D97706">02</text>
      <text x="882" y="380" font-size="24" font-weight="bold" fill="#0E3B43">混合 RAG 管理证据</text>
      <text x="882" y="406" font-size="18" fill="#5B6770">每条结论有 evidenceId 与定位</text>
